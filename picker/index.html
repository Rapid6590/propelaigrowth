S":{"新手上線組合":{"who":"第一次接觸行為經濟學的老闆、主管","time":"半天","what":"開場核心＋六個決定：對客人三題、對員工三題，其中兩題是同一個決定換邊做","msg":"先不急著加預算、不改產品、不換系統——先改你手上已經有的那幾張紙。","take":"六個兩週內可以試的決定，各附一段 AI 提示詞；你的價目表與交辦單，當場各改一次","fit":"想先看看這套東西對自己公司有沒有用，還不想一次投一整天"},"業務開展組合":{"who":"業務團隊、自己跑業務的創辦人","time":"半天／一天","what":"半天＝一次成交對話的六個路口；一天＝再加價目表四題與談判桌兩題","msg":"成交卡住的地方通常不在價格，在「我再想想」之後的那四天。","take":"第一封信、方案頁、報價後跟進訊息各改過一次；議價時的讓步節奏表","fit":"有在跑業務、有報價單、最近丟過幾個到嘴邊的案子"},"導入不落地組合":{"who":"主管、HR、客戶成功","time":"一天","what":"上午對員工六題、下午對客戶六題——同一組決定換邊做","msg":"買了沒人用——不管買的人是你的員工還是你的客戶，卡住的是同一件事。","take":"交辦單與週報、到職說明信與第一件交辦、啟用信與第一次設定頁，共六份改過一次","fit":"導了新系統沒人填、新人流動高、或客戶簽了約卻沒上線"},"公部門組合":{"who":"機關承辦與科室主管","time":"半天","what":"一張申請表從第一眼到送出之後，六個決定","msg":"民眾辦不成的地方，多半在這張表的第幾欄——那是查得出來的。","take":"你手上那張申請表與通知函改過一次；透明與公平兩道閘門的自檢表","fit":"有申請表、通知函、催辦流程，而且退件率或逾期率講得出數字"}},"PLANS":{"新手上線組合":{"options":[{"label":"推薦這六個決定","time":"半天","items":[["PR",0],["FMC",1],["FMC",5],["RP",0],["RP",3],["RP",4]],"why":"第一次上，我們不挑最完整的，挑**最容易選錯、而且你回去兩週內真的改得動**的。\n\n前三題動的是客人看到的東西：價目表上的第一個數字、結帳頁那一格、送出之後他看到什麼。後三題動的是員工看到的東西：新系統的權限、週報、獎金辦法。\n\n**第 2 題和第 4 題是同一個決定（預設），第 3 題和第 5 題也是（回饋）**——一邊對客人、一邊對員工。你會在同一個半天裡看到同一個旋鈕從兩個方向長出來，那是這套方法最值錢的地方，也是為什麼我們不用「行業」分，而是用「決定」分。"}],"swap":"沒有結帳頁的話，第 2、3 題換成「讓民眾辦得成」或你自己的申請表版本——同一組決定，工件換掉。獎金辦法短期改不動的話，第 6 題換成「交辦時要不要讓他寫下哪天幾點做」。"},"業務開展組合":{"options":[{"label":"推薦這六個決定","time":"半天","items":[["YS",0],["YS",1],["YS",2],["YS",3],["YS",4],["YS",5]],"why":"這六題不是六個技巧，是**同一段對話的六個路口**：從第一句話，一路到報價之後第幾天跟進。\n\n照順序上，因為現場最常卡的是第 2 題（先回答哪三個問號）——而那一題要先走過第 1 題才聽得懂。半天結束，你的第一封信、方案頁、報價後跟進訊息各改過一次。"},{"label":"推薦這十二個決定","time":"一天","items":[["YS",0],["YS",1],["YS",2],["YS",3],["YS",4],["YS",5],["PR",0],["PR",1],["PR",2],["PR",3],["PR",6],["PR",7]],"why":"上午走完一次成交對話，下午走價格——而且下午刻意分兩半：**前四題是他看到的價目表**（第一個數字、旁邊有沒有東西襯它、總價要不要拆、折扣怎麼說），**後兩題是桌上真的開始談之後**（誰先出價、折扣怎麼讓）。\n\n價格那一條線其實有八題，我們拿掉了兩題：「價目表上要不要有一個免費」是通路題不是業務題；「客人以為這是什麼」對已經在跟你談的客戶用不到。兩題都在講義裡。"}],"swap":"上午那六題有三種場景，同一組決定換一批英雄：對個人消費者、對企業客戶、**創辦人自己陌生開發**（「找不到第一批客人」）。報名時說一聲，我們換場景，題目不變。製造業送樣驗證的版本規劃中。\n如果你的情況是「產品剛做出來還沒人用」，那是另一組決定（驗證需求、砍範圍、第一批用戶），我們會建議直接換成那個主題。"},"導入不落地組合":{"options":[{"label":"推薦這十二個決定","time":"一天","items":[["RP",0],["RP",1],["RP",2],["RP",3],["RP",4],["RP",5],["AC",0],["AC",1],["AC",2],["AC",3],["AC",4],["AC",5]],"why":"上午跟下午是**同一組決定換邊做**。\n\n上午你是買方——改自己部門的權限、交辦單、週報、獎金辦法。下午你是賣方——改交出去的那份設定、那封啟用信、那個進度條。\n\n第 1 題兩邊都是「預設」：上午問「新系統要不要自動開通」，下午問「交付當下資料要不要一鍵帶入」。**同一個旋鈕，換邊就換人做。** 買了沒人用這件事，不管買的人是你的員工還是你的客戶，卡住的是同一個地方——這一天就是要讓你看到那件事。"}],"swap":"痛在新人不在客戶的話，下午六題換成「新人來了，沒人帶」；痛在客服回法不一，換成「客訴來了，客服卻各回各的」。三個都是同一組決定換場景，上午那六題不動。"},"公部門組合":{"options":[{"label":"推薦這六個決定","time":"半天","items":[["FMG",0],["FMG",1],["FMG",2],["FMG",3],["FMG",4],["FMG",5]],"why":"這六題就是一張申請表**從第一眼到送出之後**的順序：哪一欄能不能不要他填、哪一格能不能先勾好、先問什麼、要不要分頁、末尾要不要留一格讓他寫哪天辦、送出之後他看到什麼。\n\n六題動的是**同一份工件**，所以半天結束你手上是一張真的改過的表，不是六個想法。"}],"swap":"痛在催繳通知而不是申請表的話，第 5、6 題換成通知函版本——同一組決定，工件換成那封信。"}},"THEME_PLANS":{"PR":{"label":"推薦這六題","time":"半天","items":[0,1,2,3,6,7],"why":"八題分成兩段：**前面六題是客人自己在看的時候**（價目表、方案頁、你發出去的訊息），**最後兩題是你們真的坐下來談的時候**。半天版兩段各留重點——價目表留四題（第一個數字、旁邊有沒有東西襯它、總價要不要拆、折扣怎麼說），談判桌留兩題（誰先出價、折扣怎麼讓）。\n\n拿掉的兩題：「價目表上要不要有一個免費」是**入口與通路的決定**，不是報價的決定；「客人以為這是什麼」處理的是**陌生訊息會不會被當成廣告**，比較屬於開發階段。兩題都在講義裡。","swap":"如果你的痛是「名單發出去沒人理」而不是「價格談不下來」，把那兩題換回來、拿掉先出價與讓步——那是開發版的六題。一天版則八題全上，中間不用取捨。"},"HS":{"label":"推薦這六題","time":"半天","items":[1,2,3,4,5,6],"why":"多數人來上這一堂是**要買**，不是要賣。所以半天版六題全部站在買方那一側：開價怎麼開、車位家具仲介費怎麼拆、帶看三戶哪一戶是襯托用的、仲介那四句話哪一句是真的損失、他問你想出多少時先報還是先問、屋主的讓步節奏怎麼讀。\n\n拿掉的是第 1 題「刊登標題：客人會把它歸到哪一類」——那一題是**賣方**的決定，你在買方這一側用不到。","swap":"要賣房的話把第 1 題換回來，拿掉「帶看三戶哪一戶是襯托用的」——那是你被帶看的時候才用得到的。七題全上就是一天版的前半。"},"SH":{"label":"推薦這六題","time":"半天","items":[0,1,3,4,5,6],"why":"這七題是一條時間軸：先決定要綁多緊，再決定從哪一天開始，最後決定破功之後怎麼回來。半天只走得完六站。\n\n拿掉的是「怎麼把未來的自己拉近」——那一題的概念最漂亮，但它動到的工件最間接（要先寫一封信給二十年後的自己），從現場做完到回去真的用上，中間隔得最遠。\n\n**最後一題（破功之後怎麼接回來）一定留著。** 那是這一條線的招牌：撐不過第三週多半不是意志力問題，是你沒有先決定破功之後怎麼回來。","swap":"如果你是為了「一直想做但一直沒開始」來的，那把「怎麼把未來的自己拉近」換回來、拿掉「要不要先排一個彈性時段」——彈性那一題是給已經開始、但一破功就整個散掉的人用的。"}},"Q1":[{"k":"c","l":"客人","d":"個人消費者、會員、病人"},{"k":"b","l":"企業客戶","d":"採購、總部、製程課長"},{"k":"e","l":"員工","d":"你的團隊、新人、客服組   const el=document.createElement('button');el.type='button';
  el.className='row'+(opt.flat?' flat':'')+(opt.dim?' dim':'');
  el.innerHTML='<div class="tx"><b>'+esc(b)+'</b>'+(s?'<span>'+esc(s)+'</span>':'')+'</div>'
    +(opt.tag?'<span class="tag">'+esc(opt.tag)+'</span>':'')
    +'<div class="cv">'+(opt.flat?'':'▸')+'</div>';
  el.onclick=onclick;return el;
}
function hero(b,s,onclick){
  const el=document.createElement('button');el.type='button';el.className='hero';
  el.innerHTML='<div class="tx"><b>'+esc(b)+'</b><span>'+esc(s)+'</span></div><div class="cv">▸</div>';
  el.onclick=onclick;return el;
}
function go(screen){stack.push(screen);render()}
function back(){if(stack.length>1){stack.pop();render()}}
function home(){stack.length=0;stack.push(HOME);render()}
function render(){
  const sc=stack[stack.length-1];
  $('pk-back').classList.toggle('on',stack.length>1);
  $('pk-home').classList.toggle('on',stack.length>1);
  $('pk-crumb').innerHTML=stack.slice(1).map(s=>esc(s.crumb||'')).filter(Boolean).map(t=>'<b>'+t+'</b>').join(' ▸ ');
  $('pk-h1').textContent=sc.h1||'找到適合你的課';
  $('pk-sub').textContent=sc.sub||'';
  const v=$('pk-view');v.innerHTML='';
  sc.build(v);
  window.scrollTo({top:0,behavior:stack.length>1?'smooth':'auto'});
}

// ── 首頁 ──
const HOME={h1:'找到適合你的課',sub:'先找到你現在遇到的痛點，再看那一堂課會做完哪些決定。',build(v){
  const g=document.createElement('div');g.className='list';
  g.appendChild(hero('自己選課','三個問題，找到你現在的痛點',()=>go(WHO)));
  g.appendChild(hero('熱門推薦','已經排好的四種上課方式',()=>go(BUNDLES)));
  g.appendChild(hero('課程總表','所有主題，一次看完',()=>go(MAP)));
  v.appendChild(g);
}};

// ── 自己選課 ──
const WHO={crumb:'自己選課',h1:'你要改變的是誰？',sub:'',build(v){
  const g=document.createElement('div');g.className='list';
  D.Q1.forEach(it=>g.appendChild(row(it.l,it.d,()=>go(stage(it)))));
  v.appendChild(g);
}};
function stage(a1){return{crumb:a1.l,h1:'他卡在哪一段？',sub:'',build(v){
  const g=document.createElement('div');g.className='list';
  (D.Q2[a1.k]||[]).forEach(it=>{
    const key=a1.k+'.'+it.k;const q3=D.Q3[key];
    g.appendChild(row(it.l,it.d,()=>q3?go(split(it,q3)):go(course(D.DIRECT[key],it.l))));
  });
  v.appendChild(g);
}}}
function split(a2,q3){return{crumb:a2.l,h1:q3.ask,sub:'',build(v){
  const g=document.createElement('div');g.className='list';
  q3.opts.forEach(o=>g.appendChild(row(o.l,o.d,()=>go(course(o.to,o.l)))));
  v.appendChild(g);
}}}

// ── 課程卡 ──
function course(id,crumb){const t=D.TITLES[id];return{crumb:crumb||t.t,h1:t.t,sub:t.s,build(v){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="big">'+esc(t.msg)+'</div>'
   +'<div class="pair"><div><h4>誰適合上</h4><p>'+esc(t.who)+'</p></div>'
   +'<div><h4>上完帶得走什麼</h4><p>'+esc(t.take)+'</p></div>'
   +(t.note?'<div><h4>這一題的邊界</h4><p>'+esc(t.note)+'</p></div>':'')+'</div>'
   +'<div class="note">工件：'+esc(t.art)+'　｜　版本：'+esc(t.scenes)+'</div>';
  v.appendChild(c);
  const g=document.createElement('div');g.className='list';g.style.marginTop='12px';
  if(t.st==='soon'){
    g.appendChild(row('這一題還在建','先跟講師說一聲，我們會在講義附錄先給你最接近的兩題',()=>{},{flat:true,dim:true}));
  }else{
    const tp=D.THEME_PLANS[id];
    if(tp){
      g.appendChild(row(tp.label,tp.time+'・'+t.n+' 題裡挑 '+tp.items.length+' 題，已經幫你挑好',()=>go(themePlan(id))));
      g.appendChild(row('全部 '+t.n+' 個決定','一天版全上，中間不用取捨',()=>go(decisions(id))));
    }else{
      g.appendChild(row('課堂上會做完的決定',t.n===6?'六個決定，剛好半天':t.n+' 個決定，一題一題做',()=>go(decisions(id))));
    }
  }
  (t.bundle||[]).forEach(b=>{if(D.BUNDLES[b])g.appendChild(row(b,'這一題也在這個組合裡',()=>go(bundle(b))))});
  v.appendChild(g);
}}}

// ── 決定清單 ──
function decisions(id){const t=D.TITLES[id];return{crumb:'決定清單',h1:t.n+' 個決定',sub:t.t,build(v){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<ol class="qs">'+t.q.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol>';
  v.appendChild(c);
  const g=document.createElement('div');g.className='list';g.style.marginTop='12px';
  g.appendChild(row('每一題課堂上怎麼上','一題裡會發生的五件事',()=>go(HOWTO)));
  v.appendChild(g);
}}}

// ── 一題怎麼上 ──
const HOWTO={crumb:'一題怎麼上',h1:'每一題怎麼上',sub:'一個決定，走完這五步',build(v){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="steps">'
   +'<div class="step"><i>1</i><p><b>一個決定</b>——你本來就在做、只是沒把它當決定的那一個。</p></div>'
   +'<div class="step"><i>2</i><p><b>一個概念</b>——為什麼多數人會選錯那一邊。</p></div>'
   +'<div class="step"><i>3</i><p><b>三個真實案例</b>——盡量回頭查原始出處；沒有可靠證據的，我們會直接說沒有。</p></div>'
   +'<div class="step"><i>4</i><p><b>一題勾選</b>——換你替書中那位主角決定，再跟隔壁對答案。</p></div>'
   +'<div class="step"><i>5</i><p><b>一段 AI 提示詞</b>——掃 QR 就能複製，回座位貼進 ChatGPT 直接用。</p></div>'
   +'</div>'
   +'<div class="gift"><h4>課後加碼：每一題再多兩頁</h4><p>我們手上的材料比課堂上講得完的多，所以每一題的講義再多給你兩頁：一張<b>延伸卡</b>（同一個決定的另外兩個研究），和一個<b>設計案</b>——同一個概念換到別的場景會長成什麼樣。設計案是拿來想的，不是標準答案；你有空的時候翻一翻，常常翻著翻著就接到自己手上那件事了。</p></div>';
  v.appendChild(c);
}};

// ── 單一主題的半天推薦 ──
function themePlan(id){const t=D.TITLES[id];const p=D.THEME_PLANS[id];
 return{crumb:p.label,h1:p.label,sub:t.t+'・'+p.time,build(v){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<ol class="qs">'+p.items.map(i=>'<li>'+esc(t.q[i])+'</li>').join('')+'</ol>';
  v.appendChild(c);
  const w=document.createElement('div');w.className='card';w.style.marginTop='12px';
  w.innerHTML='<h4 class="wh">為什麼挑這幾題</h4>'+md(p.why);
  v.appendChild(w);
  if(p.swap){const sw=document.createElement('div');sw.className='gift';sw.style.marginTop='12px';
    sw.innerHTML='<h4>可以換的</h4>'+md(p.swap);v.appendChild(sw);}
  const g=document.createElement('div');g.className='list';g.style.marginTop='12px';
  g.appendChild(row('全部 '+t.n+' 個決定','一天版全上',()=>go(decisions(id))));
  v.appendChild(g);
}}}

// ── 熱門推薦 ──
const BUNDLES={crumb:'熱門推薦',h1:'已經排好的上課方式',sub:'四種組合，挑一個最像你現在的情況',build(v){
  const g=document.createElement('div');g.className='list';
  Object.entries(D.BUNDLES).forEach(([name,b])=>g.appendChild(row(name,b.fit,()=>go(bundle(name)),{tag:b.time})));
  v.appendChild(g);
}};
function bundle(name){const b=D.BUNDLES[name];return{crumb:name,h1:name,sub:b.time,build(v){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="big">'+esc(b.msg)+'</div>'
   +'<div class="pair"><div><h4>誰適合上</h4><p>'+esc(b.who)+'</p></div>'
   +'<div><h4>什麼時候你會需要它</h4><p>'+esc(b.fit)+'</p></div>'
   +'<div><h4>上完帶得走什麼</h4><p>'+esc(b.take)+'</p></div></div>';
  v.appendChild(c);
  const g=document.createElement('div');g.className='list';g.style.marginTop='12px';
  const pl=D.PLANS[name];
  if(pl)pl.options.forEach((o,i)=>g.appendChild(row(o.label,o.time+'・已經幫你排好順序',()=>go(plan(name,i)))));
  const ids=D.bundleItems[name]||[];
  if(ids.length)g.appendChild(row('這個組合會從哪些主題挑',ids.length+' 個主題',()=>go(bundleList(name))));
  v.appendChild(g);
}}}
function plan(name,i){const pl=D.PLANS[name];const o=pl.options[i];
 return{crumb:o.label,h1:o.label,sub:name+'・'+o.time,build(v){
  const c=document.createElement('div');c.className='card';
  let html='<ol class="qs">',last=null;
  o.items.forEach(([id,qi])=>{
    const t=D.TITLES[id];
    const tag=(t.t===last)?'':'<span class="qt">'+esc(t.t)+'</span>';
    last=t.t;
    html+='<li>'+esc(t.q[qi])+tag+'</li>';
  });
  html+='</ol>';
  c.innerHTML=html;v.appendChild(c);
  const w=document.createElement('div');w.className='card';w.style.marginTop='12px';
  w.innerHTML='<h4 class="wh">為什麼挑這幾題</h4>'+md(o.why);
  v.appendChild(w);
  if(pl.swap){
    const sw=document.createElement('div');sw.className='gift';sw.style.marginTop='12px';
    sw.innerHTML='<h4>可以換的</h4>'+md(pl.swap);
    v.appendChild(sw);
  }
}}}
function bundleList(name){const ids=D.bundleItems[name]||[];return{crumb:'相關主題',h1:name,sub:'推薦的題目從這些主題裡挑；其餘的在講義裡',build(v){
  const g=document.createElement('div');g.className='list';
  ids.forEach(id=>{const t=D.TITLES[id];g.appendChild(row(t.t,t.n+' 個決定',()=>go(course(id)),{dim:t.st==='soon',tag:t.st==='soon'?'規劃中':null}))});
  v.appendChild(g);
}}}

// ── 課程總表 ──
const MAP={crumb:'課程總表',h1:'所有主題',sub:'點一個看它在處理什麼',build(v){
  D.GROUPS.forEach(([g,ids])=>{
    const d=document.createElement('div');d.className='grp';
    d.innerHTML='<h3>'+esc(g)+'</h3>';
    const l=document.createElement('div');l.className='list';
    ids.forEach(id=>{const t=D.TITLES[id];
      l.appendChild(row(t.t,t.n+' 個決定',()=>go(course(id)),{dim:t.st==='soon',tag:t.st==='soon'?'規劃中':null}))});
    d.appendChild(l);v.appendChild(d);
  });
}};

$('pk-back').onclick=back;$('pk-home').onclick=home;
stack.push(HOME);render();
})();
</script>

</body></html>
